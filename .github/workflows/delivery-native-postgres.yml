name: Delivery Native PostgreSQL

on:
  pull_request:
    paths:
      - 'server/**'
      - 'packages/overseek-core/**'
      - 'overseek-wc-plugin/**'
      - 'package*.json'
      - '.github/workflows/delivery-native-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/overseek-core/**'
      - 'overseek-wc-plugin/**'
      - 'package*.json'
      - '.github/workflows/delivery-native-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-delivery:
    name: Native delivery / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: overseek_test
          POSTGRES_PASSWORD: overseek_test
          POSTGRES_DB: overseek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U overseek_test -d overseek_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      # Disposable service credentials only. Native helpers ignore DATABASE_URL
      # and create/drop random schemas using the explicit test URL below.
      DATABASE_URL: postgresql://overseek_test:overseek_test@127.0.0.1:5432/overseek_test
      DIRECT_URL: ''
      DOTENV_CONFIG_PATH: /dev/null
      DELIVERY_FRESHNESS_PGLITE: ''
      DELIVERY_FRESHNESS_TEST_DATABASE_URL: postgresql://overseek_test:overseek_test@127.0.0.1:5432/overseek_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend and shared-core workspaces
        run: npm ci --workspace=server --workspace=@overseek/core --include-workspace-root
      - name: Generate Prisma and build core/server (no application migrations)
        run: |
          npm run db:generate
          npm run build:packages
          npm run build -w server
      - name: Run all delivery suites against the native service
        working-directory: server
        run: |
          mkdir -p artifacts
          env -u DATABASE_URL -u DIRECT_URL npx vitest run src/services/deliveryEstimates --no-file-parallelism --reporter=default --reporter=json --outputFile=artifacts/delivery-results.json 2>&1 | tee artifacts/delivery-native.log
      - name: Require native suites and zero skipped tests
        working-directory: server
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const result = require('./artifacts/delivery-results.json');
          assert.equal(result.success, true);
          assert.ok(result.numTotalTests > 0);
          assert.equal(result.numPassedTests, result.numTotalTests);
          assert.equal(result.numPendingTests, 0);
          for (const file of ['nativeConcurrency.test.ts', 'nativeReceiptCascade.test.ts', 'freshnessMigration.test.ts']) {
            const suite = result.testResults.find(row => row.name.endsWith(file));
            assert.ok(suite && suite.assertionResults.length > 0, file);
            assert.ok(suite.assertionResults.every(row => row.status === 'passed'), file);
          }
          NODE
      - name: Upload native PostgreSQL reports (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-postgres-${{ matrix.postgres }}
          path: server/artifacts/
          if-no-files-found: warn
          retention-days: 14
