    <radialGradient id="teal" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#fff"/><stop offset=".65" stop-color="#fff"/><stop offset="1" stop-color="#ecfdf9"/></radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".12"/></filter>
  </defs>
  <rect width="620" height="240" rx="22" fill="#fff"/>

  <g transform="translate(122 34)" color="#a87908" filter="url(#shadow)">
